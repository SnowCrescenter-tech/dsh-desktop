<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 与主页面一致:仅允许自身源,内联样式例外 (开发期注入) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>DeepSeek Harness 首次设置</title>
    <link rel="stylesheet" href="./styles/onboarding.css" />
  </head>
  <body>
    <!--
      首次运行引导对话框 (设计规范 §4):
      固定 420px 宽的模态子窗口, 内容 372px 高, 绝不缩放 / 动画宽度。
      状态机 (JS 通过 .is-error / .is-verifying 切换):
        empty → 提示 "以 sk- 开头…" (tertiary); Enter 空输入无动作;
        ready → 输入非空, 主按钮可用; Enter = 提交;
        error → 输入框 error 边框 + error-subtle chip (聚焦即清除);
        verifying → 14px spinner (唯一循环动画) + 输入 / 按钮禁用。
    -->
    <main class="dialog" id="dialog">
      <!-- 40px 鲸鱼图标底衬 (accent-subtle, radius 10px); 线稿由 TS 注入 -->
      <div class="chip" id="whale-chip" aria-hidden="true"></div>

      <h1 class="title">欢迎使用 DeepSeek Harness</h1>
      <p class="desc">输入你的 DeepSeek API Key，即可开始使用。</p>

      <label class="label" for="key-input">API Key</label>
      <div class="input-shell" id="input-shell">
        <input
          id="key-input"
          class="key-input"
          type="password"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="sk-…"
        />
        <!-- 右侧眼睛切换: 掩码 / 明文 (spec §4); 两枚图标按掩码态显隐 -->
        <button id="eye-toggle" class="eye-toggle" type="button" aria-label="显示 Key" aria-pressed="false">
          <svg class="eye-icon" id="eye-icon-show" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M1.6 8C1.6 8 3.9 4.2 8 4.2S14.4 8 14.4 8 12.1 11.8 8 11.8 1.6 8 1.6 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.3" />
          </svg>
          <svg class="eye-icon" id="eye-icon-hide" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
            <path d="M1.6 8C1.6 8 3.9 4.2 8 4.2S14.4 8 14.4 8 12.1 11.8 8 11.8 1.6 8 1.6 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.3" />
            <path d="M3.2 12.8L12.8 3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- 状态槽固定 28px 高: hint / error chip / spinner 原地切换, 不产生位移 -->
      <div class="status" id="status" aria-live="polite">
        <p class="hint" id="hint">以 sk- 开头…</p>
        <span class="error-chip" id="error-chip" hidden>Key 无效，请检查后重试</span>
        <span class="spinner" id="spinner" role="progressbar" aria-label="正在验证 Key" hidden></span>
      </div>

      <div class="actions">
        <button id="later-btn" class="btn btn-secondary" type="button">稍后再说</button>
        <button id="submit-btn" class="btn btn-primary" type="button" disabled>开始使用</button>
      </div>

      <footer class="trust">
        <svg class="trust-lock" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="2.5" y="6" width="9" height="6" rx="1.5" stroke="currentColor" stroke-width="1.2" />
          <path d="M4.8 6V4.4a2.2 2.2 0 0 1 4.4 0V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        <span>Key 仅保存在本机</span>
      </footer>
    </main>
    <script type="module" src="./onboarding.ts"></script>
  </body>
</html>
