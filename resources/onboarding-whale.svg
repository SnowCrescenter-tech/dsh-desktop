<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- dsh-desktop onboarding whale mark — 56px on an accent-subtle tile.
       The body/spout use the hardcoded brand blue #4D6BFE which runtime
       (onboarding.ts) swaps to currentColor; the tile & eye stay fixed. -->
  <circle cx="28" cy="28" r="26.5" fill="#EEF1FF"/>
  <g transform="translate(5 5.2) scale(1.9)">
    <!-- whale silhouette (24-unit master geometry) -->
    <path d="M3 13.5 C2.9 10.3, 5.1 7.6, 8.7 6.9 C12.9 6.2, 17.5 6.7, 20.1 8.8 C21 9.5, 22 9.9, 23.2 9.1 C22.6 10.4, 22.2 11, 22.3 11.9 C22.4 12.9, 22.8 13.4, 23 14 C22.3 14.7, 21.3 15.5, 19.6 15 C15.4 18.2, 8.7 19, 4.9 16.7 C3.6 15.8, 3.1 14.8, 3 13.5 Z" fill="#4D6BFE"/>
    <!-- spout -->
    <path d="M8 5.6 C7.8 4.8, 7.2 4.4, 6.5 4" stroke="#4D6BFE" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M8 5.6 C8.6 4.8, 9.2 4.5, 9.9 4.4" stroke="#4D6BFE" stroke-width="1.2" stroke-linecap="round"/>
    <!-- eye (fixed cutout) -->
    <circle cx="5.2" cy="9.8" r="0.85" fill="#FFFFFF"/>
  </g>
</svg>
