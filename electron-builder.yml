# =============================================================================
# electron-builder.yml —— dsh-desktop 的 Windows 分发包配置 (T17)
#
# 产物 (经 build.ps1 驱动, 输出到 release/):
#   dsh-desktop-Setup-<版本>.exe   —— NSIS 安装器 (一键安装, 每用户)
#   dsh-desktop-<版本>-win.zip     —— electron-builder 的 win zip
#   win-unpacked\                  —— 免安装目录 (便携 zip 的源, 由 build.ps1 注入 node.exe)
#
# 关键设计:
#   * 捆绑的 DeepSeek Harness 运行时 (@deepseek-ai/dsh) 通过 extraResources 放到
#     resources/node_modules —— 是 app.asar 之外的“真实文件”。桌面应用 spawn 的是
#     独立 node.exe (见 src/main/runtime/process-handle.ts), 它读不了 asar 虚拟路径,
#     所以运行时绝不能打进 asar; src/main/profile/resolve.ts 的 resolveBinJs 从
#     app.asar 逐级向上查找, 正好能在 resources/node_modules 命中。
#   * node_modules/koffi (N-API 原生依赖) 由 electron-builder 自动包含进 asar 并
#     自动解包到 app.asar.unpacked (electron-builder 对生产依赖的处理与 files 无关)。
# =============================================================================

appId: com.dsh.desktop
productName: dsh-desktop

# 自动更新发布源 (T18): electron-updater 在运行时读取。electron-builder 会把
# 该配置写成 resources/app-update.yml, 且只为 nsis 目标生成 (便携 zip 没有,
# 更新逻辑据此区分安装版/便携版, 见 src/main/update.ts)。
publish:
  provider: github
  owner: SnowCrescenter-tech
  repo: dsh-desktop

# GitHub Release 正文 (双语)。发布步骤 `electron-builder --publish always`
# 会把它写进 Release notes (version 从 package.json 读取)。
releaseInfo:
  releaseNotes: |
    # dsh-desktop v0.2.0

    DeepSeek Harness 的 Windows 原生桌面壳 —— 无需 Node.js、无需命令行，安装后双击即用。

    ## 功能

    - 无边框窗口 + 自绘标题栏（实时状态点：青色=运行中 / 灰色=启动中 / 红色=异常）
    - 系统托盘（单击恢复窗口；右键菜单：打开主窗口 / 开机自启 / 关于 / 退出）
    - 原生 Windows 通知
    - 单实例（重复双击只唤起已有窗口）
    - 开机自启（注册表 Run 键）
    - 首启引导：引导填写 DeepSeek API Key，仅保存在本机 `%USERPROFILE%\.dsh\.env`
    - 端口 0 自动分配：每次启动自动获取空闲端口，永不与 3080 或其他程序冲突
    - 自动更新：安装版后台静默检查更新，就绪后托盘菜单「重启并更新」一键应用

    ## 本版说明

    - 内置 Node.js v24.19.0 运行时 + `@deepseek-ai/dsh@0.1.0-rc.6`
    - 两种产物：NSIS 安装器（自动更新）与便携 zip（解压即用）
    - 未签名，首次运行可能触发 SmartScreen/杀软提示，属正常现象
    - 中文文档（中英一键切换）：仓库 README 与 VitePress 文档站

    ---

    # dsh-desktop v0.2.0 (English)

    A native Windows desktop shell for DeepSeek Harness — no Node.js, no CLI, double-click to run.

    ## Features

    - Frameless window with a drawn title bar (live status dot: teal = running / grey = starting / red = error)
    - System tray (single-click restores; right-click menu: open window / start on boot / about / exit)
    - Native Windows notifications
    - Single instance (a second launch just brings the window to the front)
    - Start on boot (registry Run key)
    - First-run onboarding: guides you through adding your DeepSeek API key, stored locally in `%USERPROFILE%\.dsh\.env`
    - Port 0 auto-assign: a free port is chosen at every launch, never colliding with 3080 or anything else
    - Auto-update: installed builds check silently in the background and apply via the tray menu

    ## Notes

    - Bundles Node.js v24.19.0 and `@deepseek-ai/dsh@0.1.0-rc.6`
    - Two artifacts: NSIS installer (with auto-update) and a portable zip (extract & run)
    - Unsigned — SmartScreen / antivirus prompts on first run are expected
    - Bilingual docs with instant zh/en switching: repo README + VitePress site

directories:
  output: release
  # 构建资源目录 (installer.nsh 等, 由 build.ps1 生成; 不会被打进应用)
  buildResources: build

# 应用文件 (打入 app.asar):
#   dist/**                          —— electron-vite 构建产物 (main/preload/renderer)
#   resources/**                     —— 图标 + resources/plugins/*.tgz (插件打包产物)
#   packages/@dsh-desktop/client/**  —— 客户端插件构建产物 (lib/ + package.json,
#                                       离线插件安装 copyPluginLib 的源)
# package.json 与生产依赖 node_modules 由 electron-builder 自动包含。
files:
  - dist/**
  - resources/**
  - packages/@dsh-desktop/client/**

# 捆绑运行时: build.ps1 用便携版 npm 安装到 runtime/node_modules,
# 这里原样复制到打包应用的 resources/node_modules (app.asar 之外的真实文件)。
extraResources:
  - from: runtime/node_modules
    to: node_modules

# 直接使用 node_modules 里已安装的 electron 发行版, 跳过 electron 二进制下载
electronDist: node_modules/electron/dist

win:
  icon: resources/icon.ico
  target:
    - nsis
    - zip
  artifactName: dsh-desktop-${version}-win.${ext}

nsis:
  oneClick: true
  perMachine: false
  # build.ps1 生成: 把便携版 node.exe 放进安装目录 —— 桌面应用 spawn "node" 时,
  # Windows CreateProcess 会先搜索 exe 所在目录, 因此无需修改系统 PATH 也能启动运行时。
  include: build/installer.nsh
  artifactName: dsh-desktop-Setup-${version}.${ext}
